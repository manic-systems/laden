[package]
edition      = "2024"
license      = "EUPL-1.2"
name         = "pulse"
repository   = "https://github.com/manic-systems/pulse"
rust-version = "1.95.0"
version      = "1.0.0"

[features]
rusage = [ "dep:libc" ]

[dependencies]
libc      = { version = "0.2.189", optional = true }
thiserror = "2.0.12"

[dev-dependencies]
proptest = "1.5.0"

[lints.clippy]
pedantic = "warn"

[profile.release]
codegen-units = 1
lto           = true
strip         = true
