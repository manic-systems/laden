[package]
edition      = "2024"
license      = "EUPL-1.2"
name         = "laden"
repository   = "https://github.com/manic-systems/laden"
rust-version = "1.95.0"
version      = "1.0.0"

[features]
rusage = [ "dep:libc" ]

[dependencies]
flub      = "0.1.0"
libc      = { version = "0.2.189", optional = true }

[lints.clippy]
pedantic = "warn"

[profile.release]
codegen-units = 1
lto           = true
strip         = true
